name: Snapshot
on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

env:
  CI: true
  MAVEN_URL: ${{ secrets.SNAPSHOT_MAVEN_URL }}
  MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
  MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
  SNAPSHOT: true
  PATCH: ${{ github.run_number }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Build
        run: ./gradlew build

      - name: Publish Snapshot
        run: ./gradlew publishAll

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshot-libs
          path: "**/build/libs/*.jar"
          retention-days: 5
